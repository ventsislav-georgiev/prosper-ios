name: Prosper
options:
  bundleIdPrefix: eu.illegible
  deploymentTarget:
    iOS: "16.0"
# Project-wide so the app and the widget always carry the same version: App Store
# validation rejects an extension whose version drifts from its container.
settings:
  base:
    MARKETING_VERSION: "0.3"
    CURRENT_PROJECT_VERSION: "1"
packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    branch: main
schemes:
  Prosper:
    build:
      targets:
        Prosper: all
        ProsperTests: [test]
    test:
      targets: [ProsperTests]
targets:
  Prosper:
    type: application
    platform: iOS
    # Agent tooling drops .omc/ state dirs wherever a shell happens to sit; globbed
    # into the target they collide as duplicate bundle resources and fail the build.
    sources:
      - path: Sources
        excludes: ["**/.omc/**"]
    dependencies:
      - package: SwiftTerm
      # Live Activities need a widget extension to draw them (Dynamic Island +
      # lock screen). Catalyst has no Live Activities, so the extension compiles
      # to a stub there (see Widgets/ProsperWidgets.swift).
      # platformFilter: Catalyst refuses to embed an iOS .appex ("built for iOS, which
      # is not allowed"), so the extension is an iPhone-only dependency.
      - target: ProsperWidgets
        embed: true
        platformFilter: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: eu.illegible.prosperios
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Prosper
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Standard TLS only (no proprietary crypto) → exempt; skips the
        # export-compliance prompt on every TestFlight build.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        SWIFT_VERSION: "5.9"
        # Catalyst gives same-app e2e on the Mac (PLAN §8). Client is connect-only;
        # com.apple.security.network.client (in Prosper.entitlements) lets the
        # Catalyst sandbox reach the Mac (dch over Tailscale) and the account server
        # (auth + remote wake). iOS doesn't sandbox, but the key is harmless there.
        CODE_SIGN_ENTITLEMENTS: Sources/Prosper.entitlements
        SUPPORTS_MACCATALYST: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        # ponytail: local dev builds run unsigned (no team needed). CI signs for
        # TestFlight via the App Store Connect API key (see .github/workflows).
        CODE_SIGNING_ALLOWED: NO
  # Draws the watched-session Live Activity. Shares only Sources/Shared with the app —
  # the extension must stay tiny (it's launched by the system, not by us).
  ProsperWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.2"
    sources:
      - path: Widgets
      - path: Sources/Shared
    # NSExtension has to be a real plist dict — INFOPLIST_KEY_NSExtensionPointIdentifier
    # is silently dropped by the generated plist, and an appex without it never loads.
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Prosper
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: eu.illegible.prosperios.widgets
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
        CODE_SIGNING_ALLOWED: NO
  ProsperTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        excludes: ["**/.omc/**"]
    dependencies:
      - target: Prosper
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.9"
        CODE_SIGNING_ALLOWED: NO
