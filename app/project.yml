name: Prosper
options:
  bundleIdPrefix: eu.illegible
  deploymentTarget:
    iOS: "16.0"
# Project-wide so the app and the keyboards always carry the same version: App Store
# validation rejects an extension whose version drifts from its container.
settings:
  base:
    MARKETING_VERSION: "0.5"
    CURRENT_PROJECT_VERSION: "1"
packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    # Pinned: a release build should not pick up whatever landed on upstream main
    # since the last one (a build plugin did, and broke CI). Bump on purpose.
    exactVersion: 1.20.0
schemes:
  Prosper:
    build:
      targets:
        Prosper: all
        ProsperTests: [test]
    test:
      targets: [ProsperTests]
targets:
  Prosper:
    type: application
    platform: iOS
    # Agent tooling drops .omc/ state dirs wherever a shell happens to sit; globbed
    # into the target they collide as duplicate bundle resources and fail the build.
    sources:
      - path: Sources
        excludes: ["**/.omc/**"]
    dependencies:
      - package: SwiftTerm
      # Live Activities need a widget extension to draw them (Dynamic Island + Lock
      # Screen). Catalyst has no Live Activities, so the extension compiles to a stub
      # there (see Widgets/ProsperWidgets.swift), and is an iPhone-only dependency like
      # the keyboards below.
      - target: ProsperWidgets
        embed: true
        platformFilter: iOS
      # The compact keyboard as a system keyboard for every app. iOS-only:
      # platformFilter because Catalyst refuses to embed an iOS .appex ("built for iOS,
      # which is not allowed").
      - target: ProsperKeyboard
        embed: true
        platformFilter: iOS
      # The same keyboard with Bulgarian letters, a second entry in Settings › Keyboards.
      - target: ProsperKeyboardBulgarian
        embed: true
        platformFilter: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: eu.illegible.prosperios
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Prosper
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Standard TLS only (no proprietary crypto) → exempt; skips the
        # export-compliance prompt on every TestFlight build.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        # The keyboards' mic key (#598, DictationService): only the app records. What has no
        # INFOPLIST_KEY_ (the `prosper` URL scheme the keyboard opens it by, background audio
        # to keep the mic ready) is in Sources/Info.plist, merged into the generated one.
        INFOPLIST_FILE: Sources/Info.plist
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Prosper turns the mic on when you dictate with the Prosper keyboard's mic key, and keeps it ready for the time you choose in Settings."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Prosper turns what you dictate with the Prosper keyboard's mic key into text."
        SWIFT_VERSION: "5.9"
        # Catalyst gives same-app e2e on the Mac (PLAN §8). Client is connect-only;
        # com.apple.security.network.client (in Prosper.entitlements) lets the
        # Catalyst sandbox reach the Mac (dch over Tailscale) and the account server
        # (auth + remote wake). iOS doesn't sandbox, but the key is harmless there.
        # Also the App Group the keyboards read the Keyboard settings from (KeyboardSettings).
        CODE_SIGN_ENTITLEMENTS: Sources/Prosper.entitlements
        SUPPORTS_MACCATALYST: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        # ponytail: local dev builds run unsigned (no team needed). CI signs for
        # TestFlight via the App Store Connect API key (see .github/workflows).
        CODE_SIGNING_ALLOWED: NO
  # Draws the Mac's sessions Live Activity, which only the Worker's pushes drive. Shares
  # only Sources/Shared with the app: the system launches it, so it stays tiny.
  ProsperWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.2"
    sources:
      - path: Widgets
      - path: Sources/Shared
    # A real NSExtension dict, for the reason in ProsperKeyboard below.
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Prosper
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: eu.illegible.prosperios.widgets
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
        CODE_SIGNING_ALLOWED: NO
  # The compact keyboard as an iOS custom keyboard. Shares only Sources/Keys with the app
  # and must not link SwiftTerm: the system launches it under a ~50-70 MB memory cap.
  ProsperKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: Keyboard
      - path: Sources/Keys
    # NSExtension has to be a real plist dict — INFOPLIST_KEY_NSExtensionPointIdentifier
    # is silently dropped by the generated plist, and an appex without it never loads.
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: Prosper
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: true
            PrefersRightToLeft: false
            PrimaryLanguage: en-US
            # So the user can opt in to key clicks, haptics and the bar's Paste, which iOS
            # withholds from a keyboard without full access. The keyboard never touches the
            # network, and the pasteboard only through Paste.
            RequestsOpenAccess: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: eu.illegible.prosperios.keyboard
        # The app's App Group, for the Keyboard settings (KeyboardSettings).
        CODE_SIGN_ENTITLEMENTS: Keyboard/Keyboard.entitlements
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
        CODE_SIGNING_ALLOWED: NO
  # ProsperKeyboard again, with Apple's "Bulgarian – QWERTY" letters: its own extension so
  # Settings lists it beside the English one and the globe cycles them. The controller
  # picks the layout from PrimaryLanguage (TerminalKeyboard.Layout).
  ProsperKeyboardBulgarian:
    type: app-extension
    platform: iOS
    # The controller alone: Keyboard/ also holds the English Info.plist, which would land
    # here as a resource.
    sources:
      - path: Keyboard/KeyboardViewController.swift
      - path: Sources/Keys
    info:
      path: KeyboardBulgarian/Info.plist
      properties:
        # As the English one: Settings and the globe's list show the name with the
        # language under it ("Prosper / Bulgarian"); another name gets "— Prosper" added.
        CFBundleDisplayName: Prosper
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            # No Latin letters, like Apple's Bulgarian. iOS still offers it in email and
            # URL fields, as it does Apple's.
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: bg-BG
            # As in ProsperKeyboard.
            RequestsOpenAccess: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: eu.illegible.prosperios.keyboard-bg
        # As in ProsperKeyboard.
        CODE_SIGN_ENTITLEMENTS: Keyboard/Keyboard.entitlements
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
        CODE_SIGNING_ALLOWED: NO
  ProsperTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        excludes: ["**/.omc/**"]
    dependencies:
      - target: Prosper
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.9"
        CODE_SIGNING_ALLOWED: NO
