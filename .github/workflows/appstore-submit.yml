name: App Store submit

# Attaches a processed TestFlight build to the editable App Store version and
# submits it for App Review. Metadata and screenshots are the metadata
# workflow's job; run that first. Release type (manual / after approval) is
# whatever App Store Connect already has. A submission still waiting for review
# is cancelled first, so a newer build replaces it (deliver's reject_if_possible
# doesn't apply to a build swap); one already in review stops the run.
on:
  workflow_dispatch:
    inputs:
      build_number:
        description: TestFlight build number to submit (the testflight run number)
        required: true

jobs:
  submit:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Read MARKETING_VERSION
        run: |
          v=$(sed -n 's/^ *MARKETING_VERSION: "\(.*\)"/\1/p' app/project.yml)
          test -n "$v" || { echo "::error::MARKETING_VERSION not found in app/project.yml"; exit 1; }
          echo "VERSION=$v" >> "$GITHUB_ENV"

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: false

      - name: Install fastlane
        run: gem install fastlane --no-document

      - name: Build API key file
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          jq -n \
            --arg kid "$ASC_KEY_ID" \
            --arg iss "$ASC_ISSUER_ID" \
            --arg key "$ASC_KEY_P8" \
            '{key_id:$kid, issuer_id:$iss, key:$key, in_house:false, duration:1200}' \
            > "$RUNNER_TEMP/asc_key.json"

      - name: Pull a submission still waiting for review
        run: |
          ruby - "$RUNNER_TEMP/asc_key.json" <<'RUBY'
          require "spaceship"
          Spaceship::ConnectAPI.token = Spaceship::ConnectAPI::Token.from_json_file(ARGV[0])
          app = Spaceship::ConnectAPI::App.find("eu.illegible.prosperios") or abort "app not found"
          sub = app.get_in_progress_review_submission(platform: Spaceship::ConnectAPI::Platform::IOS)
          exit 0 unless sub
          abort "A submission is #{sub.state}; not pulling it." unless sub.state == "WAITING_FOR_REVIEW"
          puts "Cancelling review submission #{sub.id} (#{sub.state})"
          sub.cancel_submission
          60.times do
            break unless app.get_in_progress_review_submission(platform: Spaceship::ConnectAPI::Platform::IOS)
            sleep 5
          end
          left = app.get_in_progress_review_submission(platform: Spaceship::ConnectAPI::Platform::IOS)
          abort "Submission still #{left.state} after 5 min" if left
          puts "Pulled from review"
          RUBY

      - name: Submit for review
        env:
          BUILD: ${{ inputs.build_number }}
        run: |
          fastlane deliver \
            --api_key_path "$RUNNER_TEMP/asc_key.json" \
            --app_version "$VERSION" \
            --build_number "$BUILD" \
            --skip_binary_upload true \
            --skip_metadata true \
            --skip_screenshots true \
            --force true \
            --submit_for_review true \
            --precheck_include_in_app_purchases false \
            --submission_information '{"export_compliance_uses_encryption": false}'
